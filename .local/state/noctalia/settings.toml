config_version = 8

[bar.default]
center = [ "temp", "cpu", "ram", "network_rx", "network_tx" ]
end = [
    "screenshot",
    "tray",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "keyboard_layout",
    "battery",
    "notifications",
    "clock"
]
font_family = "Cantarell"
font_weight = 350
margin_ends = 0
radius = 8
start = [ "workspaces", "todo" ]
thickness = 28
widget_spacing = 8

[battery]
warning_threshold = 20

[brightness]
enable_ddcutil = true
minimum_brightness = 0.04999999888241291

[calendar]
enabled = true

    [calendar.account.personal_google]
    color = "primary"
    type = "google"

[control_center]
sidebar = "none"
sidebar_section = "none"
width = 820

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "system"

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000002", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 256.0
    box_width = 256.0
    cx = 1296.0
    cy = 322.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        show_forecast = true

    [desktop_widgets.widget.desktop-widget-0000000000000002]
    box_height = 192.0
    box_width = 192.0
    cx = 112.0
    cy = 578.0
    output = "eDP-1"
    rotation = -0.0
    type = "clock"

        [desktop_widgets.widget.desktop-widget-0000000000000002.settings]
        background = false
        circle = true
        clock_style = "analog"
        color = "tertiary"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 1261.0
    cy = 552.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

[dock]
shadow = false

[location]
address = "Saint-Petersburg"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1720.0
    cy = 1258.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 720.0
    cy = 781.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
background_opacity = 0.99999997764825821
position_vertical = "center_left"

    [osd.kinds]
    keyboard_layout = false

[plugins]
enabled = [ "gambled23/mangowm-keymode", "shin/lrc", "nightwatch75/todo" ]

[shell]
app_icon_colorize = true
clipboard_history_max_entries = 250
corner_radius_scale = 0.60000000894069672
external_ip_enabled = true
font_family = "Cantarell"
panel_anchor_bar = "default"
polkit_agent = true

    [shell.launcher]
    categories = false
    compact = true

        [shell.launcher.providers.calculator]
        prefix = "calc"

        [shell.launcher.providers.emoji]
        global = true
        prefix = "emo"

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_control_center = true
    open_near_click_session = true
    polkit_placement = "attached"
    polkit_position = "auto"

    [shell.screen_corners]
    enabled = true
    size = 24

    [shell.screenshot]
    show_cursor = true

    [shell.shadow]
    alpha = 0.50999998860061169
    direction = "center"

[theme]
builtin = "Gruvbox"
community_palette = "Nord Aurora"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/ctizen/Pictures/wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/ctizen/Pictures/wallpapers/pexels-veeterzy-39811.jpg"

    [wallpaper.last]
    path = "/home/ctizen/Pictures/wallpapers/pexels-veeterzy-39811.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/ctizen/Pictures/wallpapers/pexels-veeterzy-39811.jpg"

[widget.network]
show_label = false

[widget.network_rx]
display = "graph"
glyph = "arrow-narrow-down-dashed"
network_speed_compact = true
scale = 0.69999999999999996
show_label = false

[widget.network_tx]
display = "graph"
glyph = "arrow-narrow-up-dashed"
scale = 0.69999999999999996
show_label = false

[widget.todo]
type = "nightwatch75/todo:todo"